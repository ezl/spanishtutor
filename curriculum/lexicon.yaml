      - {es: momento, en: moment, pos: noun, gender: m, note: "-ment becomes -mento."}

  # ── A1 legacy vocabulary skills ─────────────────────────────────────────────
  # These lessons existed before the lexicon and improvised their words. Backing
  # them with packs is what stops the model choosing different words each run.
  #
  # NOTE: a1_vocab_core_adjectives deliberately has NO pack. It is a set of
  # opposites -- grande/pequeño, caro/barato, fácil/difícil -- which is exactly
  # the semantically clustered presentation that Tinkham, Waring and Erten &
  # Tekin all found slows learning and causes cross-association. Its adjectives
  # are distributed into the thematic packs below instead, where they attach to
  # a situation rather than to each other. The skill should be retired.

