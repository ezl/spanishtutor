modes:
  - listening
  - reading
  - spoken_interaction
  - spoken_production
  - writing

skills:
  # ─── A1 ───────────────────────────────────────────────
  # Lessons 1-3 are formulaic chunks, taught whole and NOT analyzed.
  # Processability Theory Stage 1 is words and formulas with no syntax; see
  # docs/vocabulary.md. Do not decompose "me llamo" into a reflexive verb here.
  - id: a1_introduce_yourself
    name: Introduce yourself
    cefr_level: A1
    description: "hola, me llamo ___, ¿cómo te llamas?, mucho gusto, adiós. Taught as whole phrases, never broken into parts. The student should be able to meet a person and say their own name by the end."

  - id: a1_how_are_you
    name: Ask how someone is
    cefr_level: A1
    description: "¿cómo estás?, bien, mal, más o menos, ¿y tú?, gracias, por favor. Whole phrases. This is the first two-turn exchange — the student asks, hears an answer, and answers back."
    prerequisites: [a1_introduce_yourself]

  - id: a1_keep_talking
    name: Keep the conversation going
    cefr_level: A1
    description: "no entiendo, ¿cómo se dice ___?, otra vez, más despacio, no sé, ¿qué significa? Whole phrases. These let the lesson itself run in Spanish, so every one that lands raises how much Spanish the student can be given from here on."
    prerequisites: [a1_how_are_you]

  # "Power verbs" — first-person forms taught as unanalyzed chunks, not as
  # conjugation. Each one is a sentence starter the student can attach anything to.
  - id: a1_chunks_want_have
    name: Saying what you want and have
    cefr_level: A1
    description: "quiero ___, tengo ___, me gusta ___, no me gusta ___. Taught as fixed sentence openers the student attaches a noun to, not as verb conjugation. quiero un café, tengo un perro."
    prerequisites: [a1_keep_talking]

  - id: a1_chunks_go_need
    name: Saying where you go and what you need
    cefr_level: A1
    description: "voy a ___, necesito ___, puedo ___, hay ___. Again fixed openers, not conjugation. voy a is taught as one unit precisely because ir is maximally irregular — the student gets the useful form without meeting the paradigm."
    prerequisites: [a1_chunks_want_have]

  # Never say the word "cognate" to a student. Frame it as discovering Spanish
  # they already know.
  - id: a1_words_you_know
    name: Spanish you already know
    cefr_level: A1
    description: "Recognizing the huge set of Spanish words an English speaker already knows: -tion→-ción (information/información), -ty→-dad (city/ciudad), -ly→-mente (rapidly/rápidamente), -ous→-oso (famous/famoso), -ment→-mento. Recognition only — this is about reading and hearing, not producing. Do not use the word 'cognate'."
    prerequisites: [a1_keep_talking]

  # Lessons below build toward deliberate telegraphic speech ("yo ir escuela").
  # This is Processability Theory Stage 2 and the Basic Variety (Klein & Perdue):
  # the developmental stage that follows formulas. See docs/vocabulary.md for the
  # fossilization risk and the three guardrails.
  - id: a1_people_words
    name: Words for people
    cefr_level: A1
    description: "yo, tú, él, ella, nosotros, ellos, ellas. Just the words and who they point at. No verb agreement yet."
    prerequisites: [a1_words_you_know]

  - id: a1_action_words
    name: Words for actions
    cefr_level: A1
    description: "hablar/hablo, comer/como, correr/corro, trabajar/trabajo, vivir/vivo. Each action word is taught together with its 'I' form from the start, so the anchor is already there when present tense arrives later. Regular verbs only — ir is handled as the chunk 'voy a'."
    prerequisites: [a1_people_words]

  - id: a1_place_words
    name: Words for places
    cefr_level: A1
    description: "casa, escuela, trabajo, gimnasio, tienda, restaurante, parque, ciudad. Draw on the student's own interests for which places matter to them."
    prerequisites: [a1_action_words]

  - id: a1_say_something_real
    name: Putting words together
    cefr_level: A1
    description: "Combining a person word, an action word and a place into something meaningful even though it is not yet grammatical: 'yo comer casa', 'ella correr parque'. TELL THE STUDENT PLAINLY that this is a temporary scaffold — it is how they will speak this week, and they will learn the correct forms shortly. Never present it as correct Spanish. When the student produces one of these, reply naturally using the CORRECT form (recast) without stopping to correct them: they say 'ella comer taco', you answer 'sí, ella come tacos'. The goal is conveying real meaning today."
    prerequisites: [a1_place_words]

  # Numbers split on Spanish's own morphology, not round English boundaries:
  # 1-15 are unique words, 16-19 compound on diez, 21-29 on veinti-, 30+ take y.
  - id: a1_numbers_1_5
    name: Numbers 1-5
    cefr_level: A1
    description: "uno, dos, tres, cuatro, cinco. Five words."

  - id: a1_numbers_6_10
    name: Numbers 6-10
    cefr_level: A1
    description: "seis, siete, ocho, nueve, diez. Five words."
    prerequisites: [a1_numbers_1_5]

  - id: a1_numbers_11_15
    name: Numbers 11-15
    cefr_level: A1
    description: "once, doce, trece, catorce, quince. Still unique words with no pattern — this is the last of the pure memorization."
    prerequisites: [a1_numbers_6_10]

  - id: a1_numbers_16_20
    name: Numbers 16-20
    cefr_level: A1
    description: "dieciséis, diecisiete, dieciocho, diecinueve, veinte. A pattern lesson, not memorization: these are diez y seis collapsed into one word."
    prerequisites: [a1_numbers_11_15]

  - id: a1_numbers_21_100
    name: Numbers 21-100
    cefr_level: A1
    description: "veintiuno through veintinueve on the veinti- pattern; treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien; then treinta y uno and the y pattern. One rule generates every number to 100."
    prerequisites: [a1_numbers_16_20]

  - id: a1_numbers_100_1000
    name: Numbers 100-1000
    cefr_level: A1
    description: "cien for exactly 100, ciento from 101 up (ciento uno); doscientos through novecientos with gender agreement (doscientas casas); mil. Colombian prices live here — un tinto cuesta cuatro mil."
    prerequisites: [a1_numbers_21_100]

  - id: a1_numbers_arithmetic
    name: Talking about amounts
    cefr_level: A1
    description: "más, menos, por, dividido entre, son/es; ¿cuánto es?, ¿cuánto cuesta?, ¿cuántos hay?. Turns the number words into something you can transact with — asking a price and understanding the answer."
    prerequisites: [a1_numbers_100_1000]

  - id: a1_dates_time
    name: Dates and telling time
    cefr_level: A1
    description: "Days of the week, months, seasons; qué hora es; times of day (mañana, tarde, noche)"
    prerequisites: [a1_numbers_21_100]

  - id: a1_nouns_gender
    name: Nouns and grammatical gender
    cefr_level: A1
    description: "Masculine/feminine distinction, el/la/los/las, patterns for guessing gender (-o/-a, -ión, -dad)"

  - id: a1_ser_estar_basic
    name: Ser vs. estar — basics
    cefr_level: A1
    description: "Ser for identity, origin, and permanent traits; estar for location and temporary states"
    prerequisites: [a1_nouns_gender]

  - id: a1_present_ar
    name: Present tense — regular -AR verbs
    cefr_level: A1
    description: "hablar, trabajar, escuchar, caminar, comprar — full conjugation, first/second/third person"
    prerequisites: [a1_nouns_gender]

  - id: a1_present_er_ir
    name: Present tense — regular -ER and -IR verbs
    cefr_level: A1
    description: "comer, beber, leer; vivir, escribir, abrir — patterns and contrast with -AR endings"
    prerequisites: [a1_present_ar]

  - id: a1_vocab_family
    name: Vocabulary — family & relationships
    cefr_level: A1
    description: "madre, padre, hermano/a, abuelo/a, hijo/a, amigo/a, novio/a; possessives mi/tu/su"

  - id: a1_vocab_food_drink
    name: Vocabulary — food & drink
    cefr_level: A1
    description: "Common foods, drinks, meals (desayuno, almuerzo, cena); ordering basics; me gusta/no me gusta"

  - id: a1_vocab_colors_clothing
    name: Vocabulary — colors & clothing
    cefr_level: A1
    description: "Colors with gender agreement; common clothing items; llevar/usar"
    prerequisites: [a1_nouns_gender]

  - id: a1_vocab_home_objects
    name: Vocabulary — home & common objects
    cefr_level: A1
    description: "Rooms (cocina, baño, sala); furniture; common classroom and everyday objects"

  - id: a1_vocab_body
    name: Vocabulary — body parts
    cefr_level: A1
    description: "Head, face, torso, limbs; tengo dolor de; reflexive use with body parts"

  - id: a1_vocab_question_words
    name: Vocabulary — question words
    cefr_level: A1
    description: "qué, quién/quiénes, cuándo, dónde, por qué, cómo, cuánto/a/os/as; question word order; accent marks that distinguish qué from que"

  - id: a2_adjective_agreement
    name: Adjective agreement and placement
    cefr_level: A2
    description: "Gender and number agreement; adjectives after noun (descriptive) vs before (limiting/value); apocopation (buen, gran)"
    prerequisites: [a1_nouns_gender]

  - id: a2_pattern_comparisons
    name: Comparisons — more, less, as…as
    cefr_level: A2
    description: "más/menos + adjective/adverb + que; tan + adjective/adverb + como; superlatives (el/la más, el/la menos); irregular forms (mejor, peor, mayor, menor)"
    prerequisites: [a2_adjective_agreement]

  - id: a2_stem_change_e_ie
    name: Stem-changing verbs — e->ie
    cefr_level: A2
    description: "querer, preferir, entender, pensar, perder — e->ie in all persons except nosotros/vosotros"
    prerequisites: [a1_present_ar, a1_present_er_ir]

  - id: a2_stem_change_o_ue
    name: Stem-changing verbs — o->ue
    cefr_level: A2
    description: "poder, dormir, volver, recordar, encontrar, jugar (u->ue) — pattern and practice"
    prerequisites: [a1_present_ar, a1_present_er_ir]

  - id: a2_stem_change_e_i
    name: Stem-changing verbs — e->i
    cefr_level: A2
    description: "pedir, seguir, servir, repetir, elegir — pattern, contrast with e->ie verbs"
    prerequisites: [a1_present_ar, a1_present_er_ir]

  - id: a2_go_verbs
    name: Go-verbs — irregular yo forms
    cefr_level: A2
    description: "tener (tengo), venir (vengo), hacer (hago), poner (pongo), salir (salgo), traer (traigo), saber (sé), conocer (conozco)"
    prerequisites: [a1_present_ar]

  - id: a2_saber_conocer
    name: Saber vs. conocer
    cefr_level: A2
    description: "Saber for facts and learned skills (sé nadar, sé que viene); conocer for familiarity with people and places (conozco a María, conozco Medellín). Both are go-verbs in the yo form: sé, conozco."
    prerequisites: [a2_go_verbs]

  - id: a2_reflexive_verbs
    name: Reflexive verbs
    cefr_level: A2
    description: "Reflexive pronouns (me, te, se, nos); levantarse, llamarse, ducharse, acostarse, sentirse"
    prerequisites: [a1_present_ar]

  - id: a2_pattern_present_progressive
    name: Present progressive — estar + gerundio
    cefr_level: A2
    description: "Gerund formation: -ando (-AR), -iendo (-ER/-IR); irregular gerunds (diciendo, durmiendo, pidiendo, yendo); estar + gerundio for ongoing actions; contrast with simple present"
    prerequisites: [a1_ser_estar_basic, a1_present_er_ir]

  - id: a2_pattern_verb_infinitive
    name: Verb + infinitive constructions
    cefr_level: A2
    description: "querer, poder, deber, necesitar, tener que, hay que + infinitive; meaning differences; no conjugation on second verb; very high-frequency constructions"
    prerequisites: [a2_stem_change_e_ie, a2_stem_change_o_ue]

  - id: a2_future_periphrastic
    name: Near future — ir + a + infinitive
    cefr_level: A2
    description: "Voy a + infinitive for near future and plans; contrast with present tense for plans; the most common way to talk about the future in speech"
    prerequisites: [a1_present_ar, a2_go_verbs]

  - id: a2_preterite_ar
    name: Preterite — regular -AR verbs
    cefr_level: A2
    description: "hablar->hablé, caminar->caminé; full conjugation; time markers ayer, anoche, la semana pasada"
    prerequisites: [a1_present_ar]

  - id: a2_preterite_er_ir
    name: Preterite — regular -ER and -IR verbs
    cefr_level: A2
    description: "comer->comí, vivir->viví; -ER/-IR share endings; contrast with -AR endings"
    prerequisites: [a2_preterite_ar]

  - id: a2_imperatives
    name: Imperative — commands
    cefr_level: A2
    description: "Affirmative tú commands only: habla, come, escribe, which are the third-person present form; the eight irregulars ven, di, haz, ten, sal, sé, ve, pon. Negative and usted commands are subjunctive forms and are taught after the subjunctive"
    prerequisites: [a2_go_verbs, a2_reflexive_verbs]

  - id: a2_direct_object_pronouns
    name: Direct object pronouns — lo, la, los, las
    cefr_level: A2
    description: "Replacing a direct object noun with lo, la, los, las; matching gender and number to the noun replaced. Where the pronoun goes is a separate skill"
    prerequisites: [a1_nouns_gender, a1_present_ar]

  - id: a2_indirect_object_pronouns
    name: Indirect object pronouns — le, les
    cefr_level: A2
    description: "Le/les for to/for whom; common verbs: dar, decir, mandar, preguntar, regalar"
    prerequisites: [a2_direct_object_pronouns]

  - id: a2_pronoun_placement
    name: Pronoun placement
    cefr_level: A2
    description: "Where a pronoun goes, one at a time: before a conjugated verb (lo veo); attached to an infinitive or gerund, or before the whole phrase (quiero verlo / lo quiero ver, estoy haciéndolo / lo estoy haciendo); attached to an affirmative command (dilo); the written accent that appears when attaching"
    prerequisites: [a2_direct_object_pronouns, a2_imperatives]

  - id: a2_vocab_connectors_basic
    name: Vocabulary — basic connectors
    cefr_level: A2
    description: "Coordinating: y, o, pero, sino; causal: porque, ya que; temporal: cuando, antes de, después de; additive: también, además, tampoco; result: entonces, por eso"

  - id: a2_gustar_like_verbs
    name: Gustar and similar verbs
    cefr_level: A2
    description: "Gustar, encantar, molestar, interesar, doler, parecer — reverse construction; me/te/le/nos + gusta/gustan"
    prerequisites: [a2_indirect_object_pronouns]

  - id: a2_por_para_basic
    name: Por and para — the core split
    cefr_level: A2
    description: "para for purpose, destination and deadlines (para ti, para el lunes, para aprender); por for cause, duration, exchange and movement through (por la lluvia, por dos horas, por veinte mil, por el parque). The frequent uses only — the full list comes later."
    prerequisites: [a1_present_ar]

  - id: a2_vocab_travel_directions
    name: Vocabulary — travel & directions
    cefr_level: A2
    description: "Transportation, airport/station; giving and asking directions; izquierda, derecha, seguir recto, cruzar"

  - id: a2_vocab_home_furniture
    name: Vocabulary — home & furniture
    cefr_level: A2
    description: "Rooms and spaces; furniture and appliances; hay, está/están for location; describing a home"
    prerequisites: [a1_vocab_home_objects]

  - id: a2_vocab_shopping
    name: Vocabulary — shopping & money
    cefr_level: A2
    description: "Cuánto cuesta, prices, sizes; quisiera; market vs store"

  - id: a2_vocab_health
    name: Vocabulary — health & the body
    cefr_level: A2
    description: "Symptoms, illness, doctor visits; me duele, tengo fiebre, estoy enfermo/a; pharmacy basics"
    prerequisites: [a1_vocab_body]

  - id: a2_vocab_weather
    name: Vocabulary — weather & environment
    cefr_level: A2
    description: "Hace frío/calor/sol/viento, llueve, nieva; seasons in context; weather forecasts"

  # ─── B1 ───────────────────────────────────────────────
  - id: b1_ser_estar_meaning_change
    name: Adjectives that change meaning — es listo vs está listo
    cefr_level: B1
    description: "Adjectives whose meaning shifts with ser or estar: listo (clever / ready), aburrido (boring / bored), malo (bad / ill), seguro (safe / sure), rico (wealthy / delicious), verde (green / unripe). Passive ser and estar + gerundio are separate skills and are not taught here"
    prerequisites: [a1_ser_estar_basic, a2_adjective_agreement]

  - id: b1_preterite_irreg_high_freq
    name: Preterite — high-frequency irregulars
    cefr_level: B1
    description: "ser/ir (fui), estar (estuve), tener (tuve), hacer (hice), poder (pude), querer (quise)"
    prerequisites: [a2_preterite_ar, a2_preterite_er_ir]

  - id: b1_preterite_irreg_other
    name: Preterite — other irregular stems
    cefr_level: B1
    description: "saber (supe), venir (vine), poner (puse), decir (dije), traer (traje); spelling-change verbs (-car, -gar, -zar)"
    prerequisites: [b1_preterite_irreg_high_freq]

  - id: b1_imperfect_ar
    name: Imperfect — -AR verbs
    cefr_level: B1
    description: "hablar->hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban; caminar->caminaba; habitual past (siempre hablaba), background descriptions"
    prerequisites: [a2_preterite_ar]

  - id: b1_imperfect_er_ir
    name: Imperfect — -ER/-IR verbs & irregulars
    cefr_level: B1
    description: "comer->comía, vivir->vivía; endings -ía/-ías/-ía/-íamos/-íais/-ían; 3 irregulars: ser->era, ir->iba, ver->veía; contrast with -AR endings"
    prerequisites: [b1_imperfect_ar]

  - id: b1_preterite_vs_imperfect
    name: Preterite vs. imperfect — contrast
    cefr_level: B1
    description: "Completed events (preterite) vs. background/habitual (imperfect); trigger words; narrating a story"
    prerequisites: [b1_imperfect_er_ir, a2_preterite_ar]

  - id: b1_present_perfect
    name: Present perfect — he hablado
    cefr_level: B1
    description: "haber + participio: he hablado, has comido, ha vivido; irregular participles (hecho, dicho, visto, puesto, escrito). Colombian Spanish reaches for the indefinido where Spain uses the perfect (¿ya comiste?, not ¿has comido?), so this earns its place through the experiential and still-open uses: ¿has estado alguna vez en Cartagena?, todavía no he ido, he estado pensando en eso."
    prerequisites: [b1_preterite_vs_imperfect]

  - id: b1_por_para_contrast
    name: Por vs. para — the pairs that change meaning
    cefr_level: B1
    description: "trabajo para Ana vs trabajo por Ana; salgo para Bogotá vs paso por Bogotá; lo hice para ti vs lo hice por ti. Plus the fixed expressions — por favor, por eso, por fin, para siempre."
    prerequisites: [a2_por_para_basic]

  - id: b1_future_regular
    name: Future tense — regular verbs
    cefr_level: B1
    description: "Add -é/-ás/-á/-emos/-éis/-án to infinitive stem; hablaré, comeré, viviré; time markers: mañana, la próxima semana, algún día; future of probability"
    prerequisites: [a2_future_periphrastic]

  - id: b1_future_irregular
    name: Future tense — irregular stems
    cefr_level: B1
    description: "9 irregular stems: tener->tendr-, hacer->har-, decir->dir-, poder->podr-, poner->pondr-, querer->querr-, saber->sabr-, salir->saldr-, venir->vendr-; same endings as regular"
    prerequisites: [b1_future_regular]

  - id: b1_pattern_si_clauses_real
    name: Si clauses — real conditionals
    cefr_level: B1
    description: "Si + present indicative + future: si tienes tiempo, llamaré; si + present + imperative: si quieres, ven; distinction from hypothetical si clauses (which use subjunctive)"
    prerequisites: [b1_future_regular, a1_present_ar]

  - id: b1_pattern_time_expressions
    name: Time expressions — hace, desde, llevar
    cefr_level: B1
    description: "hace + time + que + present (ongoing): hace dos años que vivo aquí; desde hace + time; llevar + time + gerundio: llevo tres horas estudiando; hace + time + preterite (ago): llegué hace una hora"
    prerequisites: [b1_imperfect_ar, a2_future_periphrastic]

  - id: b1_conditional
    name: Conditional tense
    cefr_level: B1
    description: "Same irregular stems as future; add -ía/-ías/-ía/-íamos/-íais/-ían; hypotheticals; polite requests (podría, quisiera, debería)"
    prerequisites: [b1_future_irregular]

  - id: b1_pronoun_stacking
    name: Two pronouns together — me lo, se lo
    cefr_level: B1
    description: "Indirect before direct (me lo, te la, nos los); le/les -> se before lo/la/los/las (se lo di, never le lo di); the ambiguity se creates and how context resolves it"
    prerequisites: [a2_pronoun_placement, a2_indirect_object_pronouns]

  - id: b1_pattern_que_clauses
    name: Que clauses — creo que, sé que, dice que
    cefr_level: B1
    description: "Two clauses joined by que, with its own subject and verb in the second: creo que viene, sé que está aquí, dice que llega tarde, parece que va a llover. Verbs of certainty and reporting, which keep the indicative. The structure only; the mood does not change yet"
    prerequisites: [a2_pattern_verb_infinitive, a2_preterite_er_ir]

  - id: b1_relative_pronouns
    name: Joining sentences — que, quien, donde, lo que
    cefr_level: B1
    description: "que for people and things (el libro que leí); quien/quienes after a preposition or comma (la amiga con quien fui); donde for places; lo que for a whole idea (lo que dijiste). Turning two sentences into one."
    prerequisites: [b1_pattern_que_clauses]

  - id: b1_verbs_with_prepositions
    name: Verbs that carry their own preposition
    cefr_level: B1
    description: "soñar con, pensar en, contar con, insistir en, acordarse de, tratar de, empezar a, ayudar a. The preposition belongs to the verb — it is not a choice, and translating from English gets it wrong."
    prerequisites: [a2_pattern_verb_infinitive]

  - id: b1_subjunctive_formation
    name: Subjunctive — present formation
    cefr_level: B1
    description: "Forming present subjunctive from yo form; regular and irregular forms (ser->sea, estar->esté, ir->vaya, haber->haya). Forms only; when to use them comes next"
    prerequisites: [a2_go_verbs, a2_stem_change_e_ie, b1_pattern_que_clauses]

  - id: b1_commands_negative_formal
    name: Negative and formal commands — no hables, hable usted
    cefr_level: B1
    description: "The commands that are built from the subjunctive: negative tú (no hables, no comas, no vayas) and usted/ustedes (hable, coma, hablen). Pronouns go before these, not attached: no lo digas, dígamelo becomes no me lo diga"
    prerequisites: [b1_subjunctive_formation, a2_imperatives, a2_pronoun_placement]

  - id: b1_subjunctive_two_subject
    name: One subject or two — quiero comer vs quiero que comas
    cefr_level: B1
    description: "The selection rule, taught with querer alone: same subject takes a plain infinitive (quiero comer), a different subject takes que + subjunctive (quiero que comas). Why the infinitive is wrong when the subjects differ"
    prerequisites: [b1_subjunctive_formation]

  - id: b1_subjunctive_triggers_want
    name: Subjunctive — want and hope triggers
    cefr_level: B1
    description: "More verbs that behave like querer: esperar que, necesitar que, pedir que, recomendar que, preferir que. The two-subject rule is already known; this widens the set of triggers"
    prerequisites: [b1_subjunctive_two_subject]

  - id: b1_subjunctive_triggers_doubt_emotion
    name: Subjunctive — doubt and emotion triggers
    cefr_level: B1
    description: "Dudar que, no creer que, negar que (doubt); alegrarse de que, temer que, sorprender que (emotion)"
    prerequisites: [b1_subjunctive_triggers_want]

  - id: b1_vocab_conversation_fillers
    name: Vocabulary — conversation fillers & management
    cefr_level: B1
    description: "Fillers: bueno, pues, o sea, a ver, es que, la verdad es que; tag questions: ¿no?, ¿verdad?, ¿cierto?; hesitation: mmm, este...; turn-taking: espera, ¿cómo se dice?, ¿me entiendes?"

  - id: b1_vocab_work_career
    name: Vocabulary — work & career
    cefr_level: B1
    description: "Job titles, workplace, responsibilities; job interviews; trabajar, contratar, renunciar, el sueldo"

  - id: b1_vocab_opinions
    name: Vocabulary — opinions & arguments
    cefr_level: B1
    description: "Creo que, en mi opinión, estoy de acuerdo/en desacuerdo, sin embargo, por eso, aunque"

  - id: b1_vocab_media_tech
    name: Vocabulary — media & technology
    cefr_level: B1
    description: "Internet, redes sociales, dispositivos; verbs: descargar, publicar, compartir, buscar; media consumption"

  - id: b1_vocab_emotions
    name: Vocabulary — emotions & feelings
    cefr_level: B1
    description: "Emotions with estar vs ser; sentirse + adjective; ponerse + emotion; mood nuances"

  # ─── B2 ───────────────────────────────────────────────
  - id: b2_subjunctive_impersonal
    name: Subjunctive — impersonal expressions
    cefr_level: B2
    description: "Es importante que, es necesario que, es posible que, es una lástima que + subjunctive"
    prerequisites: [b1_subjunctive_formation]

  - id: b2_subjunctive_adjective_clauses
    name: Subjunctive — adjective clauses
    cefr_level: B2
    description: "Subjunctive in relative clauses when antecedent is unknown/non-existent; busco algo que, no hay nadie que"
    prerequisites: [b1_subjunctive_triggers_want]

  - id: b2_subjunctive_past
    name: Subjunctive — imperfect (past subjunctive)
    cefr_level: B2
    description: "Imperfect subjunctive formation (-ra/-se forms); si clauses (si tuviera..., hablaría); sequence of tenses"
    prerequisites: [b1_subjunctive_formation, b1_imperfect_er_ir]

  - id: b2_passive_ser
    name: Passive voice — ser + past participle
    cefr_level: B2
    description: "Ser + past participle for true passive; agent with por; tense changes; passive vs active transformation"
    prerequisites: [a2_preterite_ar, a1_ser_estar_basic]

  - id: b2_passive_se
    name: Passive se and impersonal se
    cefr_level: B2
    description: "Se + third person for passive (se vende, se habla); impersonal se (se dice, se puede); distinction from reflexive se"
    prerequisites: [b2_passive_ser, a2_reflexive_verbs]

  - id: b2_advanced_pronouns
    name: Advanced pronouns
    cefr_level: B2
    description: "Leísmo; redundant pronouns (a Juan le dije); complex pronoun stacking edge cases; ello as neuter"
    prerequisites: [b1_pronoun_stacking]

  - id: b2_reported_speech
    name: Reported speech
    cefr_level: B2
    description: "Dijo que + indicative or subjunctive; tense backshift; preguntó si; reporting questions vs statements"
    prerequisites: [b1_subjunctive_formation, b1_imperfect_er_ir]

  - id: b2_discourse_markers
    name: Discourse markers & complex connectors
    cefr_level: B2
    description: "sin embargo, no obstante, a pesar de que, dado que, aunque + subjunctive/indicative; por lo tanto, en cambio"
    prerequisites: [b1_vocab_opinions]

  - id: b2_se_accidental
    name: Accidental se — se me olvidó
    cefr_level: B2
    description: "se me olvidó, se me cayó, se nos acabó — the construction that removes blame. se + indirect object pronoun + verb agreeing with the thing, not the person. Se me cayeron las llaves, not se me cayó."
    prerequisites: [b2_passive_se, a2_indirect_object_pronouns]

  - id: b2_perifrasis_verbales
    name: Verbal periphrases — acabar de, volver a, seguir
    cefr_level: B2
    description: "empezar a, acabar de, volver a, seguir + gerundio, ponerse a, dejar de, llevar + gerundio. How Spanish says just did it, did it again, kept doing it, has been doing it for a while."
    prerequisites: [a2_pattern_present_progressive, a2_pattern_verb_infinitive]

  - id: b2_subjunctive_temporal
    name: Subjunctive after time expressions
    cefr_level: B2
    description: "cuando, hasta que, en cuanto, antes de que, después de que — subjunctive when the event has not happened yet (cuando llegues, te aviso), indicative when it is habitual or already past (cuando llego, siempre saludo)."
    prerequisites: [b1_subjunctive_triggers_want]

  - id: b2_subjunctive_concessive
    name: Aunque — indicative or subjunctive
    cefr_level: B2
    description: "aunque + indicative for a fact the speaker accepts (aunque llueve, voy); + subjunctive for a hypothetical or conceded one (aunque llueva, voy). Same choice after a pesar de que and por más que."
    prerequisites: [b2_subjunctive_temporal]

  - id: b2_future_conditional_conjecture
    name: Guessing with future and conditional
    cefr_level: B2
    description: "Future and conditional used for probability rather than time: serán las tres (it must be three), estaría cansado (he was probably tired), ¿dónde estará? This is Spanish's main way of saying probably."
    prerequisites: [b1_future_regular, b1_conditional]

  # ── Functional skills ──────────────────────────────────────────────────────
  # The entries below describe what the student can DO rather than a structure
  # to conjugate. Spanish runs out of new grammar around B2, and CEFR is a
  # functional framework at root, so a syllabus that keeps adding structures
  # past that point answers the wrong question.
  #
  # They are deliberately written as PHRASE INVENTORIES — "creo que, es cierto
  # que... pero, por un lado / por otro, en cambio" — and not as abstract
  # descriptions of a competence. That is load-bearing: extract_units has to
  # enumerate teachable units from the description, and a phrase list enumerates
  # exactly as cleanly as a verb paradigm does. Rewriting these into prose about
  # what the student should be able to do would leave nothing to extract, and
  # the lesson would silently fall through to the legacy dense prompt.
  - id: b2_narrate_an_experience
    name: Telling a story that holds together
    cefr_level: B2
    description: "Setting the scene in imperfect, moving events with preterite, marking sequence with connectors, and holding the floor across several turns. Function rather than new grammar — deploying what you already have at length."
    prerequisites: [b1_preterite_vs_imperfect, b1_vocab_conversation_fillers]

  - id: b2_argue_a_position
    name: Making and defending a point
    cefr_level: B2
    description: "Stating a view, conceding ground, then coming back: creo que, es cierto que... pero, por un lado / por otro, en cambio, sin embargo. Disagreeing without sounding rude."
    prerequisites: [b1_vocab_opinions, b2_discourse_markers]

  - id: b2_vocab_abstract
    name: Vocabulary — abstract concepts
    cefr_level: B2
    description: "Justice, freedom, identity, power, democracy; abstract noun formation; nuanced synonyms"

  - id: b2_vocab_professional
    name: Vocabulary — professional & formal register
    cefr_level: B2
    description: "Business correspondence tone; formal vs informal equivalents; usted in professional contexts; meeting and negotiation language"
    prerequisites: [b1_vocab_work_career]

  # ─── C1 ───────────────────────────────────────────────
  - id: c1_compound_tenses_past
    name: Compound tenses — perfect and pluperfect
    cefr_level: C1
    description: "Present perfect (he hablado) vs preterite; pluperfect (había hablado) for prior past; regional variation (Spain vs Latin America)"
    prerequisites: [b1_imperfect_ar, a2_preterite_ar]

  - id: c1_compound_tenses_future
    name: Compound tenses — future and conditional perfect
    cefr_level: C1
    description: "Future perfect (habré llegado) for completed future; conditional perfect (habría ido) for unrealized past hypotheticals"
    prerequisites: [b1_future_irregular, b1_conditional]

  - id: c1_subjunctive_perfect
    name: Subjunctive — present perfect
    cefr_level: C1
    description: "Haya + past participle; expressing doubt/emotion about past events; when to use vs imperfect subjunctive"
    prerequisites: [b2_subjunctive_past, b2_subjunctive_adjective_clauses, c1_compound_tenses_past]

  - id: c1_subjunctive_pluperfect
    name: Subjunctive — pluperfect
    cefr_level: C1
    description: "Hubiera + past participle; unrealized past conditions (si hubiera sabido...); regret structures"
    prerequisites: [c1_subjunctive_perfect]

  - id: c1_subjunctive_nuanced
    name: Subjunctive — nuanced indicative vs subjunctive
    cefr_level: C1
    description: "aunque + ind/subj; cuando + ind/subj; el hecho de que; subtle meaning shifts based on mood choice"
    prerequisites: [c1_subjunctive_perfect, b2_subjunctive_past]

  - id: c1_idiomatic_expressions
    name: Idiomatic expressions & collocations
    cefr_level: C1
    description: "Fixed expressions that don't translate literally; verb+noun collocations; Colombian/Latin American idioms; coger, tomar, agarrar nuances"

  - id: c1_register_shifts
    name: Register shifts — formal, informal, written
    cefr_level: C1
    description: "Navigating formal/informal registers; written vs spoken grammar differences; voseo; academic vs colloquial style"

  - id: c1_hedging_and_softening
    name: Saying things less directly
    cefr_level: C1
    description: "quizá / tal vez + subjunctive, parece que, no es que... sino que, diría que, si no me equivoco. Controlling how committed you sound — the difference between an opinion and an assertion."
    prerequisites: [b2_subjunctive_impersonal]

  - id: c1_nominalization
    name: Turning clauses into things
    cefr_level: C1
    description: "lo + adjective (lo importante, lo difícil de esto), el hecho de que + subjunctive, lo que + verb. How formal and written Spanish compresses a whole idea into a noun phrase."
    prerequisites: [b1_relative_pronouns]

  - id: c1_connectors_argumentative
    name: Connectors that carry an argument
    cefr_level: C1
    description: "por ende, no obstante, siempre y cuando, a menos que, dado que, en la medida en que, con tal de que. Several govern the subjunctive, which is what makes them hard rather than the meaning."
    prerequisites: [b2_discourse_markers, b2_subjunctive_impersonal]

  - id: c1_summarise_and_synthesise
    name: Summarising and reporting an argument
    cefr_level: C1
    description: "Compressing something long without losing the point: reporting what someone argued, drawing out an implication, separating what was said from what was meant."
    prerequisites: [b2_reported_speech, c1_register_shifts]

  - id: c1_vocab_literary_academic
    name: Vocabulary — literary & academic
    cefr_level: C1
    description: "Academic discourse vocabulary; false cognates; nuanced synonyms (saber vs conocer vs enterarse); literary register"

  # ─── C2 ───────────────────────────────────────────────
  - id: c2_stylistic_control
    name: Full stylistic control
    cefr_level: C2
    description: "Precise word choice for effect; rhetorical devices; writing style indistinguishable from educated native speaker"

  - id: c2_dialectal_variation
    name: Dialectal variation
    cefr_level: C2
    description: "Recognition and production across regional varieties; vos/tú/usted by region; Colombian paisa vs rolo vs costeño"

  - id: c2_implication_subtext
    name: Ambiguity, implication & cultural subtext
    cefr_level: C2
    description: "Irony, understatement, sarcasm in Spanish; cultural references; reading between the lines in native-speed speech"

  - id: c2_native_fluency
    name: Near-native production fluency
    cefr_level: C2
    description: "Real-time production without hesitation; self-correction; repair strategies; native-level discourse management"
