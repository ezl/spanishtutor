<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Expired</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 380px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.75rem; }
    p  { color: #888; font-size: 0.95rem; line-height: 1.6; }
    code {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Link expired</h1>
    <p>Progress links are valid for 1 hour. Type <code>!menu</code> in Discord to get a fresh one.</p>
  </div>
</body>
</html>
