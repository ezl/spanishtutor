[env]
_.file = ".env"

[tasks.claude]
description = "Attach to the persistent Claude Code tmux session on the server"
run = "TERM=xterm-256color ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 -t \"su - claude -c 'tmux attach -t claude-agent'\""

[tasks.agent-logs]
description = "Tail agent bot logs"
run = "ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 'journalctl -u discord-claude-agent -f'"

[tasks.agent-status]
description = "Check agent service status"
run = "ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 'systemctl status discord-claude-agent --no-pager'"

[tasks.agent-restart]
description = "Restart agent service"
run = "ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 'systemctl restart discord-claude-agent'"

[tasks.secrets]
description = "Edit app secrets (.env) on the server"
run = "ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 'nano /home/claude/spanishtutor/.env'"

[tasks.secrets-show]
description = "Print app secret keys (no values)"
run = "ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 \"grep -o '^[^=]*' /home/claude/spanishtutor/.env\""

[tasks.setup]
description = "Create venv and install dependencies (run on server in dev tmux)"
run = """
python3 -m venv venv
. venv/bin/activate
pip install -r requirements.txt
echo "Done. Run: source venv/bin/activate"
"""

[tasks.shell]
description = "Open Django shell against Railway Postgres"
run = "railway run python manage.py shell"

[tasks.db]
description = "Open psql shell against Railway Postgres"
run = "railway connect Postgres"

[tasks.users]
description = "List all learner users"
run = "railway run python manage.py shell -c \"from learner.models import User; [print(u.discord_id, u.display_name, u.onboarding_complete) for u in User.objects.all()]\""

[tasks.reset-user]
description = "Reset a user by Discord ID (deletes all their data). Usage: mise run reset-user <discord_id>"
run = """
railway run python manage.py shell -c "
from learner.models import User
u = User.objects.filter(discord_id='$1').first()
if u:
    u.delete()
    print(f'Deleted {u.display_name} ({u.discord_id})')
else:
    print('User not found. Run: mise run users')
"
"""
