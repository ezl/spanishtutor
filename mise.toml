[env]
_.file = ".env"

[tasks.install]
description = "Install all dependencies"
run = "pip3 install -r requirements.txt"

[tasks.start]
description = "Start the Discord agent bot"
run = "python3 agent/bot.py"

[tasks.restart]
description = "Restart the agent service"
run = "systemctl restart spanishtutor-agent"

[tasks.logs]
description = "Tail agent logs"
run = "journalctl -u spanishtutor-agent -f"

[tasks.status]
description = "Check agent service status"
run = "systemctl status spanishtutor-agent"

[tasks.pull]
description = "Pull latest code from GitHub"
run = "git pull origin main"

[tasks.update]
description = "Pull latest code and restart agent"
run = ["git pull origin main", "systemctl restart spanishtutor-agent"]

[tasks.secrets]
description = "Edit secrets (.env) on the server"
run = "ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 'nano /root/spanishtutor/.env'"

[tasks.secrets-show]
description = "Print current secret keys (no values)"
run = "ssh -i ~/.ssh/id_ed25519 root@5.78.211.212 \"grep -o '^[^=]*' /root/spanishtutor/.env\""

[tasks.secrets-sync]
description = "Push local .env to server"
run = "scp -i ~/.ssh/id_ed25519 .env root@5.78.211.212:/root/spanishtutor/.env"
